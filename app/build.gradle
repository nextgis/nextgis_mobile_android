apply plugin: 'com.android.application'
apply plugin: 'io.sentry.android.gradle'
apply plugin: 'kotlin-android'
//apply plugin: 'kotlin-android-extensions'
//apply plugin: 'kotlin-kapt'

configurations {
    h3AndroidNatives
}

def localSigningProperties = new Properties()
def localSigningPropertiesFile = rootProject.file('local.properties')
if (localSigningPropertiesFile.exists()) {
    localSigningPropertiesFile.withInputStream { localSigningProperties.load(it) }
}

def generatedH3JniLibs = layout.buildDirectory.dir('generated/h3JniLibs')
def extractH3AndroidNatives = tasks.register('extractH3AndroidNatives', Sync) {
    from({ configurations.h3AndroidNatives.collect { zipTree(it) } }) {
        include 'android-arm/libh3-java.so'
        include 'android-arm64/libh3-java.so'
        eachFile { details ->
            if (details.path.startsWith('android-arm64/')) {
                details.path = 'arm64-v8a/libh3-java.so'
            } else if (details.path.startsWith('android-arm/')) {
                details.path = 'armeabi-v7a/libh3-java.so'
            }
        }
        includeEmptyDirs = false
    }
    into generatedH3JniLibs
}

android {
    namespace "com.nextgis.mobile"

    buildFeatures {
        buildConfig = true
    }

    sourceSets {
        main {
            jniLibs.srcDir "$buildDir/generated/h3JniLibs"
        }
    }

    packaging {
        resources {
            excludes += [
                    'darwin-arm64/libh3-java.dylib',
                    'darwin-x64/libh3-java.dylib',
                    'windows-x64/libh3-java.dll',
                    'windows-x86/libh3-java.dll'
            ]
        }
    }

    // Setup the Sentry DSN from the file 'sentry.properties', which should contain
    // sentry.dsn=https://publicKey:secretKey@host:port/1?options
    // DO NOT PUBLIC the file 'sentry.properties' !!!
    File sentryPropFile = rootProject.file('sentry.properties')
    String sentryDsn = ""
    if (sentryPropFile.exists()) {
        Properties sentryProp = new Properties()
        sentryProp.load(sentryPropFile.newDataInputStream())
        sentryDsn = sentryProp.get("sentry.dsn")
        if (sentryDsn == null || sentryDsn.trim().isEmpty()) {
            throw new GradleException("sentry.dsn is missing or empty in sentry.properties")
        }
    }else{
        throw new GradleException("Missing required file: sentry.properties. Build cannot continue.")
    }


    defaultConfig {
        applicationId 'com.nextgis.mobile'
        minSdkVersion 26
        compileSdk 36
        targetSdkVersion 36
        versionCode 199
        versionName '3.2.1'
        //archivesBaseName = "ngmobile-$versionName"
        buildConfigField "String", "SENTRY_DSN", "\"${sentryDsn}\""

        def props = new Properties()
        file("../local.properties").withInputStream { props.load(it) }

    }

    productFlavors {
    }

    def customKeystore = file('../../keystore_google')
    def signingValue = { String name ->
        project.findProperty(name) ?:
                System.getenv(name) ?:
                localSigningProperties.getProperty(name)
    }
    def signingAlias = signingValue('ANDROID_KEY') ?: signingValue('ANDROID_KEY_ALIAS')
    def hasCustomSigning = customKeystore.exists() &&
            signingValue('ANDROID_STORE_PASSWORD') &&
            signingAlias &&
            signingValue('ANDROID_KEY_PASSWORD')

    signingConfigs {
        if (hasCustomSigning) {
            debug {
                storeFile customKeystore
                storePassword signingValue('ANDROID_STORE_PASSWORD')
                keyAlias signingAlias
                keyPassword signingValue('ANDROID_KEY_PASSWORD')
            }
            release {
                storeFile customKeystore
                storePassword signingValue('ANDROID_STORE_PASSWORD')
                keyAlias signingAlias
                keyPassword signingValue('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            resValue 'string', 'APP_NAME', 'NextGIS Mobile'
            resValue 'string', 'SENTRY_DSN', sentryDsn
            resValue 'string', 'provider_auth', 'com.nextgis.mobile.provider'
            resValue 'string', 'nextgis_mobile_accounts_auth', 'com.nextgis.mobile.account'
            resValue 'string', 'nextgis_accounts_auth_type', 'com.nextgis.account'
            buildConfigField "String", "providerAuth", '"com.nextgis.mobile.provider"'
            buildConfigField "String", "nextgismobile_accounts_auth", '"com.nextgis.account"'
            if (hasCustomSigning) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            applicationIdSuffix '.debug'
            versionNameSuffix '-DEBUG'
            resValue 'string', 'APP_NAME', 'DEV NextGIS Mobile'
            resValue 'string', 'SENTRY_DSN', sentryDsn
            resValue 'string', 'provider_auth', 'com.nextgis.mobile.provider.debug'
            resValue 'string', 'nextgis_mobile_accounts_auth', 'com.nextgis.mobile.account.debug'
            resValue 'string', 'nextgis_accounts_auth_type', 'com.nextgis.account.debug'
            buildConfigField "String", "providerAuth", '"com.nextgis.mobile.provider.debug"'
            buildConfigField "String", "nextgismobile_accounts_auth", '"com.nextgis.account.debug"'
            if (hasCustomSigning) {
                signingConfig signingConfigs.debug
            }
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }


}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation project(':maplibui')
    implementation project(':easypicker-module')

    //implementation 'com.github.joshdholtz:Sentry-Android:1.6.0'
    //implementation 'io.sentry:sentry-android:1.7.30'
    implementation 'androidx.work:work-runtime:2.11.2'
    implementation ('io.sentry:sentry-android:8.37.1'){
        exclude group: 'androidx.lifecycle', module: 'lifecycle-viewmodel-ktx'
    }


    implementation 'com.github.JakeWharton:NineOldAndroids:2.4.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
//    implementation 'com.android.support:support-compat:28.0.0'
    implementation('androidx.recyclerview:recyclerview:1.4.0') {
    }
    implementation('androidx.legacy:legacy-support-v4:1.0.0') {
    }
    implementation 'com.google.android.gms:play-services-analytics:18.1.1'
//    implementation 'com.github.TechFreak:WizardPager:1.0.3'
    //implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.github.barsrb:hyperlog-android:master-SNAPSHOT'

    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.10.0'
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'org.maplibre.gl:android-sdk-opengl:13.4.1'
    implementation 'com.squareup.okhttp3:okhttp:5.3.2'
    implementation 'com.uber:h3:4.1.1'
    h3AndroidNatives 'com.uber:h3:4.1.1'

    // MapSafe OpenPGP. Keep these modules on the exact same version.
    implementation 'org.bouncycastle:bcprov-jdk18on:1.84'
    implementation 'org.bouncycastle:bcpg-jdk18on:1.84'
    implementation 'org.bouncycastle:bcutil-jdk18on:1.84'

    testImplementation 'junit:junit:4.13.2'

//    debugImplementation "com.squareup.leakcanary:leakcanary-android:2.14"
//    debugImplementation "com.squareup.leakcanary:leakcanary-android-core:2.14"

    implementation project(path: ':wizardpager')
}

tasks.named('preBuild').configure {
    dependsOn extractH3AndroidNatives
}
